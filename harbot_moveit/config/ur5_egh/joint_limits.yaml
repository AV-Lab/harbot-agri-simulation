# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed
# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
# Conservative simulation planning limits required by the Pilz planner.
# Universal Robots does not publish these limits for this UR5 model; validate
# them against the real robot controller before hardware use.
joint_limits:
  $(arg prefix)arm_elbow_joint:
    has_velocity_limits: true
    max_velocity: 3.14159265359
    has_acceleration_limits: true
    max_acceleration: 1.0
    has_deceleration_limits: true
    max_deceleration: -1.0
  $(arg prefix)arm_shoulder_lift_joint:
    has_velocity_limits: true
    max_velocity: 3.14159265359
    has_acceleration_limits: true
    max_acceleration: 1.0
    has_deceleration_limits: true
    max_deceleration: -1.0
  $(arg prefix)arm_shoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 3.14159265359
    has_acceleration_limits: true
    max_acceleration: 1.0
    has_deceleration_limits: true
    max_deceleration: -1.0
  $(arg prefix)arm_wrist_1_joint:
    has_velocity_limits: true
    max_velocity: 3.14159265359
    has_acceleration_limits: true
    max_acceleration: 1.0
    has_deceleration_limits: true
    max_deceleration: -1.0
  $(arg prefix)arm_wrist_2_joint:
    has_velocity_limits: true
    max_velocity: 3.14159265359
    has_acceleration_limits: true
    max_acceleration: 1.0
    has_deceleration_limits: true
    max_deceleration: -1.0
  $(arg prefix)arm_wrist_3_joint:
    has_velocity_limits: true
    max_velocity: 3.14159265359
    has_acceleration_limits: true
    max_acceleration: 1.0
    has_deceleration_limits: true
    max_deceleration: -1.0
  $(arg prefix)egh_gripper_finger_left_joint:
    has_velocity_limits: true
    max_velocity: 0.0125
    has_acceleration_limits: false
    max_acceleration: 0
